services:
  redis:
    image: redis
    ports:
      - "6379:6379"

  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 tradingcore.asgi:application
    ports:
      - "8000:8000"
    depends_on:
      - redis

  celery_worker:
    build: .
    command: celery -A tradingcore worker --pool=solo -l info
    depends_on:
      - redis

  celery_beat:
    build: .
    command: celery -A tradingcore beat -l info
    depends_on:
      - redis